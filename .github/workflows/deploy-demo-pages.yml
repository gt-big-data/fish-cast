# Publishes viz/poster to GitHub Pages so the Demo Day QR can open a live map.
name: Deploy demo pages

on:
  push:
    branches: [alfred-ye, main]
    paths:
      - "viz/poster/**"
      - ".github/workflows/deploy-demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site root
        run: |
          mkdir -p _site
          cp -r viz/poster/. _site/
          # Cleaner scan URL: https://<user>.github.io/fish-cast/
          cp _site/demo.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
