[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishcast"
version = "0.2.0"
description = "Forecasting Antarctic krill distribution relative to CCAMLR marine protected areas"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["fishcast*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
